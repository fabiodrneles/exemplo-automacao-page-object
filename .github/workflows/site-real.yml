name: Site real

# 002 FR-2: os testes contra o site de terceiros rodam fora do CI de PR
# (decisão D1), todo dia e sob demanda.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-real:
    name: testes contra automacao.testerglobal.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --no-daemon test -DbaseUrl=https://automacao.testerglobal.com/
      - name: Relatório dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-site-real
          path: build/reports/tests/test
          if-no-files-found: ignore
